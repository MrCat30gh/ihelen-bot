<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iHelen — Нейро-коуч</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
        }
        #chat {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }
        .message {
            margin-bottom: 15px;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user {
            text-align: right;
        }
        .message.bot {
            text-align: left;
        }
        .message-content {
            display: inline-block;
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .bot .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .menu-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e9ecef;
        }
        .menu-title {
            text-align: center;
            color: #667eea;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .menu-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .menu-btn {
            padding: 15px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        .menu-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        .menu-btn:active {
            transform: translateY(0);
        }
        .menu-btn.stop {
            border-color: #dc3545;
            color: #dc3545;
            grid-column: 1 / -1;
        }
        .menu-btn.stop:hover {
            background: #dc3545;
            color: white;
        }
        .input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e9ecef;
        }
        #userInput {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        #userInput:focus {
            border-color: #667eea;
        }
        #sendBtn {
            margin-top: 10px;
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        #sendBtn:hover {
            background: #5568d3;
        }
        .hidden {
            display: none !important;
        }
        .error {
            color: #dc3545;
            text-align: center;
            padding: 10px;
        }
    /* Модальное окно */
.modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    animation: fadeIn 0.2s;
}
.modal-content {
    background: white;
    padding: 30px;
    border-radius: 20px;
    max-width: 500px;
    width: 90%;
    position: relative;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}
.close-btn {
    position: absolute;
    top: 10px;
    right: 20px;
    font-size: 28px;
    cursor: pointer;
    color: #999;
    transition: color 0.2s;
}
.close-btn:hover {
    color: #333;
}
.modal-content h2 {
    margin-top: 0;
    color: #667eea;
    text-align: center;
}
.modal-description {
    text-align: center;
    color: #666;
    margin-bottom: 20px;
}
.slider-container {
    margin: 20px 0;
}
.slider-labels {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #888;
    margin-bottom: 10px;
}
input[type="range"] {
    width: 100%;
    height: 8px;
    border-radius: 5px;
    background: linear-gradient(to right, #667eea, #764ba2);
    outline: none;
    -webkit-appearance: none;
}
input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: white;
    border: 3px solid #667eea;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
input[type="range"]::-moz-range-thumb {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: white;
    border: 3px solid #667eea;
    cursor: pointer;
}
.temp-value {
    text-align: center;
    margin-top: 15px;
    font-size: 16px;
    color: #333;
}
.temp-value strong {
    color: #667eea;
    font-size: 20px;
}
.temp-description {
    text-align: center;
    margin-top: 10px;
    font-style: italic;
    color: #764ba2;
    font-size: 14px;
}
.apply-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 20px;
    transition: transform 0.2s, box-shadow 0.2s;
}
.apply-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
}

    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 iHelen — Нейро-коуч</h1>
        </div>

        <div id="chat"></div>

        <!-- Главное меню -->
        <div id="menu" class="menu-container hidden">
            <div class="menu-title">Выберите тему:</div>
            <div class="menu-buttons">
                <button class="menu-btn" onclick="sendMenuAction('goals')">🌠 Цели</button>
                <button class="menu-btn" onclick="sendMenuAction('fear')">🎭 Страх</button>
                <button class="menu-btn" onclick="sendMenuAction('summary')">📊 Саммари</button>
                <button class="menu-btn" onclick="openTemperatureModal()">🌡️ Стиль</button>
                <button class="menu-btn stop" onclick="sendMenuAction('stop')">🛑 Стоп</button>
            </div>
        </div>

        <!-- Поле ввода -->
        <div class="input-container">
            <input type="text" id="userInput" placeholder="Напишите сообщение..." />
            <button id="sendBtn" onclick="sendMessage()">Отправить</button>
        </div>
    </div>

<script>
    let sessionId = localStorage.getItem('ihelen_session') ||
                    'sess_' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('ihelen_session', sessionId);

    const chatBox = document.getElementById('chat');
    const input = document.getElementById('userInput');
    const menu = document.getElementById('menu');
    let waitingForName = false;
    let stopped = false;
    let userId = null;

    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = 'message ' + sender;
        div.innerHTML = '<div class="message-content">' + escapeHtml(text).replace(/\n/g, '<br>') + '</div>';
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showMenu() {
        menu.classList.remove('hidden');
    }

    function hideMenu() {
        menu.classList.add('hidden');
    }

    async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        input.value = '';

        try {
            const response = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    session_id: sessionId,
                    message: text,
                    user_name: waitingForName ? text : null
                })
            });

            if (!response.ok) throw new Error('Ошибка сервера');

            const data = await response.json();

            if (data.user_id && !userId) {
                userId = data.user_id;
                console.log('Ваш ID:', userId);
            }

            addMessage(data.reply, 'bot');

            // Показываем меню после ввода имени или после "Стоп"
            if (waitingForName || stopped) {
                waitingForName = false;
                stopped = false;
                showMenu();
            }
        } catch (err) {
            addMessage('❌ Ошибка: ' + err.message, 'bot');
        }
    }

    async function sendMenuAction(action) {
        addMessage(getActionText(action), 'user');

        try {
            const response = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    session_id: sessionId,
                    message: '[MENU:' + action + ']'
                })
            });

            if (!response.ok) throw new Error('Ошибка сервера');

            const data = await response.json();
            addMessage(data.reply, 'bot');

            if (action === 'stop') {
                stopped = true;
                hideMenu();
            } else {
                showMenu();
            }
        } catch (err) {
            addMessage('❌ Ошибка: ' + err.message, 'bot');
            showMenu();
        }
    }

    function getActionText(action) {
        const texts = {
            'goals': '🌠 Цели',
            'fear': '🎭 Страх',
            'summary': '📊 Саммари',
            'stop': '🛑 Стоп'
        };
        return texts[action] || action;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    window.onload = async () => {
        try {
            const response = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: sessionId, message: '' })
            });

            if (response.ok) {
                const data = await response.json();

                if (data.user_id) {
                    userId = data.user_id;
                    console.log('Ваш ID:', userId);
                }

                addMessage(data.reply, 'bot');
                waitingForName = true;
            }
        } catch (err) {
            console.error('Error:', err);
        }
    };
// === Управление модальным окном температуры ===
function openTemperatureModal() {
    const modal = document.getElementById('tempModal');
    const slider = document.getElementById('tempSlider');

    // Загружаем текущую температуру из localStorage или используем 0.6
    const currentTemp = parseFloat(localStorage.getItem('ihelen_temperature') || '0.6');
    slider.value = currentTemp;
    updateTempLabel(currentTemp);

    modal.classList.remove('hidden');
}

function closeTemperatureModal() {
    document.getElementById('tempModal').classList.add('hidden');
}

function updateTempLabel(value) {
    const numValue = parseFloat(value);
    document.getElementById('tempValue').textContent = numValue.toFixed(1);

    let description = '';
    if (numValue <= 0.2) {
        description = '📋 Очень сухой и точный стиль — как энциклопедия';
    } else if (numValue <= 0.4) {
        description = '📝 Сдержанный и деловой стиль';
    } else if (numValue <= 0.6) {
        description = '️ Сбалансированный стиль — золотая середина';
    } else if (numValue <= 0.8) {
        description = '🌸 Тёплый и образный стиль';
    } else {
        description = '🎨 Очень поэтичный и креативный стиль';
    }
    document.getElementById('tempDescription').textContent = description;
}

function applyTemperature() {
    const slider = document.getElementById('tempSlider');
    const temp = parseFloat(slider.value).toFixed(1);

    // Сохраняем в localStorage
    localStorage.setItem('ihelen_temperature', temp);

    // Отправляем на сервер
    const message = '[TEMP:' + temp + ']';
    addMessage('🌡️ Установить температуру: ' + temp, 'user');

    fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, message: message })
    })
    .then(response => response.json())
    .then(data => {
        addMessage(data.reply, 'bot');
        closeTemperatureModal();
    })
    .catch(err => {
        addMessage(' Ошибка: ' + err.message, 'bot');
        closeTemperatureModal();
    });
}

// Закрытие модального окна по клику вне его
document.addEventListener('click', function(event) {
    const modal = document.getElementById('tempModal');
    if (event.target === modal) {
        closeTemperatureModal();
    }
});

</script>
<!-- Модальное окно температуры -->
<div id="tempModal" class="modal hidden">
    <div class="modal-content">
        <span class="close-btn" onclick="closeTemperatureModal()">&times;</span>
        <h2>️ Настройка стиля общения</h2>
        <p class="modal-description">
            Выберите, как iHelen будет с вами общаться:
        </p>

        <div class="slider-container">
            <div class="slider-labels">
                <span> Сухой и точный</span>
                <span>🎨 Поэтичный и креативный</span>
            </div>
            <input type="range" id="tempSlider" min="0" max="1" step="0.1" value="0.6"
                   oninput="updateTempLabel(this.value)">
            <div class="temp-value">
                Текущее значение: <strong id="tempValue">0.6</strong>
            </div>
            <div class="temp-description" id="tempDescription">
                Сбалансированный стиль
            </div>
        </div>

        <button class="apply-btn" onclick="applyTemperature()">Применить</button>
    </div>
</div>

</body>
</html>
